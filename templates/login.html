<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Login - JAMBIXO</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#006837">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo">JAMBIXO</div>
    <p class="login-sub">Admin sign in</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="admin@email.com">

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
        <button type="button" id="toggle" aria-label="Show password">Show</button>
      </div>

      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
